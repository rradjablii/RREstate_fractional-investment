spring:
  application.name: rrestate-backend
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rrestate}
    username: ${POSTGRES_USER:rrestate}
    password: ${POSTGRES_PASSWORD:}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway.enabled: true
  servlet.multipart.max-file-size: 10MB
  mvc.problemdetails.enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  error.include-message: never
  error.include-stacktrace: never
  tomcat.max-swallow-size: 2MB
  max-http-request-header-size: 16KB

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never

springdoc:
  api-docs.path: /api/v1/openapi
  swagger-ui.enabled: ${SWAGGER_UI_ENABLED:false}

rrestate:
  jwt:
    issuer: ${JWT_ISSUER:rrestate}
    audience: rrestate-web
    access-ttl: 15m
    # PEM bodies (base64 DER, PKCS8 private / X509 public). Required unless profile=dev.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  refresh:
    ttl: 14d
    cookie-name: rrestate_refresh
    cookie-secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    auth-per-minute: 10
    investments-per-minute: 20
  # Compliance gates — keep disabled until legal structure is approved.
  compliance:
    investment-enabled: ${INVESTMENT_ENABLED:false}
    kyc-required: ${KYC_REQUIRED:true}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  pagination.max-size: 100

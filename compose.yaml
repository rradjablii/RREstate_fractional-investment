# Development / base stack:  docker compose up --build   ->  http://localhost:8081
name: rrestate

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rrestate}
      POSTGRES_USER: ${POSTGRES_USER:-rrestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rrestate}
      POSTGRES_USER: ${POSTGRES_USER:-rrestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-rrestate}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INVESTMENT_ENABLED: ${INVESTMENT_ENABLED:-false}
      KYC_REQUIRED: ${KYC_REQUIRED:-true}
    networks: [private, public]

  frontend:
    build: ./frontend
    networks: [public]

  proxy:
    image: caddy:2-alpine
    depends_on: [backend, frontend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["${HTTP_PORT:-8081}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [public]

networks:
  private: { internal: true }   # postgres <-> backend only; no outbound/public access
  public: {}

volumes:
  pgdata:
  caddy_data:
